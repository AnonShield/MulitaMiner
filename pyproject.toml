[project]
name = "mulita-miner"
version = "0.1.0"
description = "PDF Vulnerability Extractor - Extract vulnerabilities from PDF reports using LLM"
requires-python = ">=3.11,<3.13"

dependencies = [
    "langchain==0.3.28",
    "langchain-core==0.3.84",
    "langchain-openai==0.3.35",
    "langchain-ollama==0.3.10",
    "pdfplumber==0.11.9",
    "tqdm==4.67.3",
    "tiktoken==0.12.0",
    "python-dotenv==1.2.2",
    "deepmerge==1.1.1",
    "json-repair==0.59.5",
    "pandas==2.3.3",
    "openpyxl==3.1.5",
    "rapidfuzz==3.14.5",
    "numpy==1.26.4",
    "matplotlib==3.10.8",
    "seaborn==0.13.2",
    "bert-score==0.3.13",
    "rouge-score==0.1.2",
    "torch==2.11.0",
    "scikit-learn==1.8.0",
    "jinja2==3.1.6",
    "scipy==1.13.1",
]

[project.optional-dependencies]
markdown = [
    "marker-pdf>=1.10.2",
]

# Local HuggingFace inference on GPU (4-bit quantization).
# Install only on GPU machines: `uv sync --extra hf-local`.
# bitsandbytes needs CUDA (Linux, or Windows with bitsandbytes>=0.43).
hf-local = [
    "transformers>=4.45.0",
    "accelerate>=1.0.0",
    "bitsandbytes>=0.43.0",
]
