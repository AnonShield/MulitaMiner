[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mulita-miner"
version = "0.1.0"
description = "PDF Vulnerability Extractor - Extract vulnerabilities from PDF reports using LLM"
requires-python = ">=3.11"

# Core = the extraction runtime only (PDF -> structured JSON via LLM). Kept lean
# so the common-user image stays small. The evaluation/metrics/plot stack and
# the heavy Marker PDF backend live in optional extras below.
dependencies = [
    "langchain==0.3.28",
    "langchain-core==0.3.84",
    "langchain-openai==0.3.35",
    "langchain-ollama==0.3.10",
    "pdfplumber==0.11.9",
    "tqdm==4.67.3",
    "tiktoken==0.12.0",
    "python-dotenv==1.2.2",
    "deepmerge==1.1.1",
    "json-repair==0.59.5",
    "pandas==2.3.3",
    "openpyxl==3.1.5",
    "rapidfuzz==3.14.5",
    "pydantic>=2,<3",
    "numpy==1.26.4",
    "requests==2.33.1",
]

[project.optional-dependencies]
# Evaluation / metrics / reporting stack. Required to run the ``metrics.*``
# package, ``tools/run_metrics.py``, ``tools/run_experiments.py`` and the chart
# pipeline. Pulls torch (via bert-score) — the bulk of the research image size.
metrics = [
    "matplotlib==3.10.8",
    "seaborn==0.13.2",
    "bert-score==0.3.13",
    "rouge-score==0.1.2",
    "torch==2.11.0",
    "scikit-learn==1.8.0",
    "scipy==1.13.1",
    "jinja2==3.1.6",
]
# Marker PDF backend — the ``--md`` extraction path. Heavy ML; the default
# pdfplumber backend needs none of it, so it stays opt-in.
marker = [
    "marker-pdf>=1.10.2",
]
# Everything needed for research (experiments + metrics + charts + Marker).
full = [
    "mulita-miner[metrics,marker]",
]
# Local HuggingFace inference on GPU (4-bit quantization).
# Install only on GPU machines: `uv sync --extra hf-local`.
# bitsandbytes needs CUDA (Linux, or Windows with bitsandbytes>=0.43).
hf-local = [
    "transformers>=4.45.0",
    "accelerate>=1.0.0",
    "bitsandbytes>=0.43.0",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repo root on sys.path so tests can import the top-level ``metrics`` package
# (mulitaminer is already importable via the editable install).
pythonpath = ["."]
markers = ["slow: integration tests that hit real LLMs (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
